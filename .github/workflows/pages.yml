name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'studio/dist/**'
      - 'vendor/rhwp/npm/editor/**'
      - 'deploy/github-pages/**'
      - 'engine/**'
      - 'server/**'
      - 'docs/manuals/**'
      - 'docs/DEPLOYMENT_AND_AI_GUIDE.md'
      - 'docs/AGENT_SETUP.md'
      - 'docs/MCP_EVENTS_GUIDE.md'
      - 'docs/CHATGPT_WORK_FILES.md'
      - 'docs/AUTOMATIC_AI_GUIDE.md'
      - 'docs/SERVER_MIGRATION.md'
      - 'deploy/Caddyfile.example'
      - 'skill/hwpx-standard-report/reference/**'
      - 'tutorial/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  refresh-release-links:
    if: github.event_name == 'release' && (github.event.action == 'deleted' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh downloads from the Pages deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
  deploy:
    if: github.event_name != 'release'
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            web
            studio/dist
            vendor/rhwp/npm/editor
            deploy/github-pages
            server
            engine
            tutorial
            docs
            skill/hwpx-standard-report/reference
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix deploy/github-pages --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tutorial chart renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install matplotlib
      - name: Build personal workspace with GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PAGES_RELEASE_JSON="$RUNNER_TEMP/latest-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$PAGES_RELEASE_JSON"
          node deploy/github-pages/build-site.mjs _site
      - name: Check links in the published artifact
        run: python3 deploy/github-pages/check-links.py _site --base "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
