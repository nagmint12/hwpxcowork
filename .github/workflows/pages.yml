name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'studio/dist/**'
      - 'vendor/rhwp/npm/editor/**'
      - 'deploy/github-pages/**'
      - 'engine/**'
      - 'server/**'
      - 'docs/manuals/**'
      - 'skill/hwpx-standard-report/reference/**'
      - 'tutorial/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            web
            studio/dist
            vendor/rhwp/npm/editor
            deploy/github-pages
            server
            engine
            tutorial
            docs
            skill/hwpx-standard-report/reference
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix deploy/github-pages --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tutorial chart renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install matplotlib
      - name: Build personal workspace with GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PAGES_RELEASE_JSON="$RUNNER_TEMP/latest-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$PAGES_RELEASE_JSON"
          node deploy/github-pages/build-site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
