<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWPX 공동 검토</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- GitHub Pages 입구(2026-11-18): hwpx-cowork 서버의 화면을 그대로 보여 준다(로그인·문서함·AI 연결·튜토리얼 모두 그 서버가 처리).
       build-site.mjs 가 아래 SERVER 자리를 저장소 변수 HWPX_SERVER_URL 로 채운다. iframe 이름은 web/pages-host.js FRAME_NAME 과 같다 —
       서버 화면이 이 이름을 보고 'GitHub 페이지' 로 알아 API 키·토큰 저장을 막는다. -->
  <style>
    html, body { margin: 0; height: 100%; background: #f6f8fa; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
    noscript { display: block; padding: 24px; font: 15px/1.6 system-ui, sans-serif; }
  </style>
</head>
<body>
  <iframe id="app" name="hwpx-cowork-github-pages" title="HWPX 공동 검토" allow="clipboard-read; clipboard-write; local-fonts; fullscreen" allowfullscreen referrerpolicy="origin"></iframe>
  <noscript>이 페이지는 JavaScript 가 필요합니다.</noscript>
  <script>
    (() => {
      const SERVER = __HWPX_SERVER__;
      const frame = document.getElementById('app');
      const target = new URL(SERVER);
      target.searchParams.set('host', 'github-pages');
      target.hash = location.hash;
      frame.src = target.href;
      // 서버 화면이 알려 주는 # 를 이 주소에 맞춘다(새로 고침·즐겨찾기). 토큰이 든 주소(#/t/…)는 받지 않는다
      window.addEventListener('message', (e) => {
        if (e.origin !== target.origin || e.source !== frame.contentWindow) return;
        const d = e.data;
        if (!d || d.type !== 'hwpx-cowork:hash' || typeof d.hash !== 'string' || /^#\/t\//.test(d.hash)) return;
        if (d.hash !== location.hash) history.replaceState(null, '', d.hash || location.pathname);
      });
    })();
  </script>
</body>
</html>
