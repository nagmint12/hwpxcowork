<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AI 검토 따라하기 · Hwpx Cowork</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../site.css">
  <script type="module" src="tutorial.js"></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="../?intro=0"><img src="../brand.png" width="32" height="32" alt=""><span>hwpx<span class="dot">.</span>cowork</span></a>
      <nav class="top-nav" aria-label="바로 가기"><a href="../?intro=0">체험 페이지</a><a href="../teaser/">소개 영상</a></nav>
    </div>
  </header>
  <main class="shell tutorial">
    <section class="hero">
      <h1>AI 검토 따라하기</h1>
      <p class="lead">준비된 예시로 요청부터 반영까지 따라 해 보세요. 이 튜토리얼은 AI에 연결하거나 문서를 전송하지 않습니다.</p>
    </section>
    <noscript><p>클릭으로 진행하려면 JavaScript가 필요합니다. 검토 흐름은 요청 → 예시 제안 확인 → 반영 또는 거절 순서입니다.</p></noscript>
    <section class="trial demo" id="demo-request" aria-labelledby="request-title">
      <h2 id="request-title" tabindex="-1">1. 검토 요청하기</h2>
      <blockquote id="original-text">다음 학기부터 강의실 예약 신청을 온라인을 통해서 진행할 예정입니다.</blockquote>
      <p>검토 요청 <strong>문장을 더 간결하게 다듬어 주세요.</strong></p>
      <div class="actions"><button class="btn primary" type="button" id="show-proposal">예시 제안 보기</button></div>
    </section>
    <section class="trial demo" id="demo-review" aria-labelledby="review-title" hidden>
      <h2 id="review-title" tabindex="-1">2. 제안 검토하기</h2>
      <blockquote id="suggested-text">다음 학기부터 강의실을 온라인으로 예약할 수 있습니다.</blockquote>
      <p>예시 메모 <strong>‘신청을 온라인을 통해서 진행’이라는 표현을 줄였습니다.</strong></p>
      <div class="actions">
        <button class="btn primary" type="button" id="apply-proposal">반영</button>
        <button class="btn ghost" type="button" id="reject-proposal">거절</button>
      </div>
    </section>
    <section class="trial demo" id="demo-result" aria-labelledby="result-title" hidden>
      <h2 id="result-title" tabindex="-1">3. 결과 확인하기</h2>
      <p id="demo-status" role="status"></p>
      <blockquote id="result-text"></blockquote>
      <div class="actions">
        <button class="btn ghost" type="button" id="restart-demo">다시 해 보기</button>
        <a class="btn primary" href="../studio/?url=..%2Fsamples%2Freport-sample.hwpx&amp;filename=%EA%B2%B0%EA%B3%BC%EB%B3%B4%EA%B3%A0%EC%84%9C.hwpx">견본 보고서 편집하기</a>
      </div>
    </section>
  </main>
</body>
</html>
