<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ · Hwpx Cowork 소개 영상</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../site.css">
</head>
<body class="film-page" data-film="__FILM__">
  <header class="top">
    <div class="shell top-inner">
      <span class="brand">소개 영상</span>
      <nav class="top-nav" aria-label="영상 선택">
        <a href="../teaser/" data-film-link="teaser">기능 소개</a>
        <a href="../teaser3/" data-film-link="teaser3">여백의 손글씨</a>
        <a href="../?intro=0">체험으로 →</a>
      </nav>
    </div>
  </header>
  <main id="teaser" class="tz" aria-label="__TITLE__ 영상">
    <p class="film-status" role="status">소개 영상을 불러오는 중입니다.</p>
    <noscript><p class="film-status">영상을 재생하려면 JavaScript가 필요합니다.</p></noscript>
  </main>
  <script type="module">
    const film = document.body.dataset.film;
    document.querySelector(`[data-film-link="${film}"]`).setAttribute('aria-current', 'page');
    const player = document.getElementById('teaser');
    const next = film === 'teaser' ? '../teaser3/' : '../?intro=0';
    const query = new URLSearchParams(location.search);
    const autoplay = query.get('autoplay') !== '0' && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    import('./player.js').then(({ mount }) => mount(player, {
      frame: true,
      autoplay,
      loop: false,
      onEnd: query.get('loop') === '0' ? undefined : () => setTimeout(() => location.replace(next), 600),
    })).catch(() => {
      const status = document.createElement('p');
      status.className = 'film-status';
      status.setAttribute('role', 'status');
      status.textContent = '영상을 불러오지 못했습니다. 위 메뉴에서 다른 영상이나 체험을 열 수 있습니다.';
      player.replaceChildren(status);
    });
  </script>
</body>
</html>
