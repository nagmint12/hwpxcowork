<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file:"><meta name="color-scheme" content="light dark"><title>Hwpx Cowork</title>
<!-- 2026-11-18: 흰 바탕(어두운 테마는 검은 바탕) + 새 앱 아이콘(움직이는 그림 loading-icon.webp — scripts/make-icons.mjs) -->
<style>:root{--bg:#fff;--text:#16161a;--muted:#6b6b76;--track:#ebe7f5;--accent:#7c3aed}@media(prefers-color-scheme:dark){:root{--bg:#000;--text:#f4f4f6;--muted:#a3a3ad;--track:#2a2533;--accent:#a78bfa}}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;display:grid;place-items:center;min-height:100vh}main{text-align:center}.mark{display:block;width:80px;height:80px;margin:0 auto 24px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 12px}p{color:var(--muted);margin:0}.dots{margin:28px auto;width:24px;height:24px;border:3px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.dots{animation:none}}</style>
<main><img class="mark" src="loading-icon.webp" alt=""><h1>내 문서를 여는 중입니다</h1><p>서버와 편집기를 함께 준비합니다.</p><div class="dots"></div></main></html>
