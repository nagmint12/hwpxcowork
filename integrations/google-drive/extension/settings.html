<!doctype html><html lang="ko"><meta charset="utf-8"><title>보관용 Google Drive 설정</title>
<body><h1>구글 드라이브 연결 — 보관용</h1><p>현재 제품에서는 비활성화된 기능입니다.</p>
<p>Google Cloud에서 Drive API를 사용 설정하고 웹 애플리케이션 OAuth 클라이언트를 만드세요. 아래 리디렉션 주소를 등록합니다.</p>
<code id="redirect"></code><label>Google OAuth 클라이언트 ID<input id="google-client" placeholder="…apps.googleusercontent.com"></label><button id="google-login">구글 계정 연결</button><button id="google-logout">구글 연결 해제</button><p id="google-status" role="status"></p>
<script type="module" src="settings.js"></script></body></html>
